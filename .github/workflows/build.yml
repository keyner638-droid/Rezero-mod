name: Compilar mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -o rezero-proyecto.zip -d proyecto
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar
        working-directory: proyecto
        run: gradle build --no-daemon
      - name: Publicar jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" proyecto/build/libs/*.jar --title "Build ${{ github.run_number }}" --notes "Compilado automaticamente"
